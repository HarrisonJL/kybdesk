<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KYB Desk</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1c1d1f; --muted: #62666d; --line: #e3e1d9;
    --ok: #1f7a4d; --ok-bg: #e2f3ea; --warn: #9a6a00; --warn-bg: #fbf0d4; --bad: #b3322d; --bad-bg: #fbe4e2;
    --none: #5b616a; --none-bg: #eceae4; --accent: #2f4fd1; --bar: #d9d6cb; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141517; --panel: #1c1e21; --ink: #ececea; --muted: #9a9ea6; --line: #2e3136;
      --ok: #62d49a; --ok-bg: #173226; --warn: #e6b94d; --warn-bg: #352b11; --bad: #ff8c85; --bad-bg: #3a1c1b;
      --none: #aab0b8; --none-bg: #26292d; --accent: #8ea2ff; --bar: #34383e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141517; --panel: #1c1e21; --ink: #ececea; --muted: #9a9ea6; --line: #2e3136;
    --ok: #62d49a; --ok-bg: #173226; --warn: #e6b94d; --warn-bg: #352b11; --bad: #ff8c85; --bad-bg: #3a1c1b;
    --none: #aab0b8; --none-bg: #26292d; --accent: #8ea2ff; --bar: #34383e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 64px; }
  a { color: var(--accent); }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 36px 0 12px; font-weight: 600; }
  .sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch; }
  .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: flex-end; }
  .meta { font-size: 13px; color: var(--muted); text-align: right; }
  .meta code, .mono { font-family: var(--mono); font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 22px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat b { display: block; font-size: 24px; line-height: 1.1; }
  .stat span { color: var(--muted); font-size: 13px; }
  .rules { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px;
           grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
  .rules div b { display: block; font-size: 13px; margin-bottom: 2px; }
  .rules div span { color: var(--muted); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; }
  .name { font-weight: 650; font-size: 17px; }
  .num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 650; letter-spacing: .02em; white-space: nowrap; }
  .ok { background: var(--ok-bg); color: var(--ok); } .warn { background: var(--warn-bg); color: var(--warn); }
  .bad { background: var(--bad-bg); color: var(--bad); } .none { background: var(--none-bg); color: var(--none); }
  .why { color: var(--muted); font-size: 13.5px; margin: 8px 0 0; }
  .bar { position: relative; height: 8px; background: var(--bar); border-radius: 99px; margin: 12px 0 4px; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--ok); border-radius: 99px; }
  .bar.dead i { background: var(--bad); } .bar.warn i { background: var(--warn); }
  .barlab { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 8px; flex-wrap: wrap; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 18px; margin: 12px 0 0; font-size: 13px; }
  .facts div span { color: var(--muted); display: block; font-size: 12px; }
  .chain { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 13px; }
  .chain div { display: flex; gap: 10px; padding: 2px 0; align-items: baseline; flex-wrap: wrap; }
  .chain .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; align-self: center; }
  .chain .when { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .gatebox { margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: var(--none-bg); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: 0; }
  .tablewrap { overflow-x: auto; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; max-width: 75ch; }
  .err { padding: 24px; border: 1px solid var(--bad); border-radius: 10px; color: var(--bad); }
</style>
</head>
<body>
<main id="app"><p class="sub">Loading…</p></main>
<script src="desk.js"></script>
<script>
(function () {
  const D = window.DESK;
  const app = document.getElementById("app");
  if (!D) { app.innerHTML = '<div class="err">desk.js is missing. Run <code>npm run snapshot</code> in studio-next/ to write it.</div>'; return; }

  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const X = D.explorer;
  const short = (a) => a.slice(0, 8) + "…" + a.slice(-6);
  const addr = (a) => `<a class="mono" href="${X}/address/${a}">${short(a)}</a>`;
  const txl = (h) => `<a class="mono" href="${X}/tx/${h}">${h.slice(0, 10)}…</a>`;
  const MAX_AGE = Number(D.gate.config.max_age_seconds);
  const snapshotAt = new Date(D.snapshot_at);

  const dur = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
  };
  const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "none";
  const fmtDay = (d) => d ? fmtDate(d + "T00:00:00Z") : "none";
  const fmtTime = (iso) => new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

  const VERDICT = { GOOD_STANDING: "ok", AT_RISK: "warn", NOT_IN_GOOD_STANDING: "bad", UNVERIFIED: "none" };
  const REASON_TEXT = {
    APPROVED: "Approved: a fresh, unexpired GOOD_STANDING attestation.",
    NO_ATTESTATION: "Never attested, so there is nothing to approve.",
    VERDICT_NOT_IN_GOOD_STANDING: "The latest attestation found the company not in good standing.",
    VERDICT_AT_RISK: "The latest attestation flagged risk: an adverse filing or a pending strike-off application.",
    VERDICT_UNVERIFIED: "The register couldn't be read or tied to this company, so no claim is made.",
    REVOKED: "A probe found the register changed since the attestation. Re-attest to restore approval.",
    EXPIRED: "The approval ran out: 30 days, or the day a filing deadline falls.",
    STALE: "Older than the consumer's own freshness limit.",
  };
  const reasonText = (r) => REASON_TEXT[r] || r;

  // Status as of NOW (the snapshot's own answer, aged): approvals run out while the page is open.
  function liveStatus(c) {
    const ap = c.approval, now = Date.now();
    if (ap.reason !== "APPROVED") return ap.reason;
    if (now >= new Date(ap.valid_until).getTime()) return "EXPIRED";
    return "APPROVED";
  }
  function gateStatus(c) {
    const s = liveStatus(c);
    if (s !== "APPROVED") return s;
    return (Date.now() - new Date(c.approval.attested_at).getTime()) / 1000 > MAX_AGE ? "STALE" : "APPROVED";
  }
  const pillClass = (s) => s === "APPROVED" ? "ok" : s === "EXPIRED" || s === "STALE" ? "warn" : s === "NO_ATTESTATION" ? "none" : "bad";

  function card(c) {
    const ap = c.approval, h = c.history, latest = h[0];
    const status = liveStatus(c), gstat = gateStatus(c);
    const label = c.label, f = latest ? latest.facts : null;
    const vendor = D.gate.vendors.find((v) => v.company_number === c.company_number);
    let bar = "", barlab = "";
    if (latest && latest.verdict === "GOOD_STANDING") {
      const a = new Date(latest.attested_at).getTime(), u = new Date(latest.valid_until).getTime(), now = Date.now();
      const pct = Math.min(100, Math.max(0, ((now - a) / (u - a)) * 100));
      const cls = status === "APPROVED" ? "" : status === "EXPIRED" ? "dead" : "warn";
      bar = `<div class="bar ${cls}" role="img" aria-label="${pct.toFixed(0)}% of the approval elapsed"><i style="width:${pct}%"></i></div>`;
      const left = u - now;
      barlab = `<div class="barlab"><span>attested ${fmtTime(latest.attested_at)}</span><span><b>${left > 0 ? "expires in " + dur(left) : "expired " + dur(-left) + " ago"}</b> · ${fmtTime(latest.valid_until)}</span></div>`;
    }
    const deadline = f && f.status_text === "Active" && latest.verdict === "GOOD_STANDING"
      ? (() => { const d = [f.accounts_due, f.confirmation_due].filter(Boolean).sort()[0];
                 const cap = new Date(latest.attested_at).getTime() + D.desk.rules.approval_days * 864e5;
                 return `<div><span>Earliest filing deadline</span>${fmtDay(d)}${d && new Date(d + "T00:00:00Z").getTime() < cap ? " (ends the approval early)" : " (beyond the 30-day cap)"}</div>`; })()
      : "";
    const facts = f ? `<div class="facts">
        <div><span>Register status</span>${esc(f.status_text || "unreadable")}</div>
        <div><span>Accounts due</span>${fmtDay(f.accounts_due)}${f.accounts_overdue ? " · overdue" : ""}</div>
        <div><span>Confirmation statement due</span>${fmtDay(f.confirmation_due)}${f.confirmation_overdue ? " · overdue" : ""}</div>
        ${deadline}
        <div><span>Officers vs previous attestation</span>${esc(latest.officers_changed)}</div>
        <div><span>LEI</span>${c.lei ? esc(f.lei_check) + " · " + esc(c.lei) : "none registered"}</div>
        ${latest.reasons.length ? `<div><span>Reasons</span>${latest.reasons.map(esc).join(", ")}</div>` : ""}
      </div>` : "";
    const chain = h.length ? `<div class="chain" aria-label="Attestation history">${h.map((a) =>
      `<div><span class="dot" style="background:var(--${VERDICT[a.verdict] === "ok" ? "ok" : VERDICT[a.verdict] === "warn" ? "warn" : VERDICT[a.verdict] === "bad" ? "bad" : "none"})"></span>
        <b>#${a.attestation_id}</b> <span>${esc(a.verdict.replaceAll("_", " ").toLowerCase())}</span>
        <span class="when">${fmtTime(a.attested_at)}${a.previous_id === null ? " · first" : " · after #" + a.previous_id}</span></div>`).join("")}</div>` : "";
    const probes = D.probes.filter((p) => p.company_number === c.company_number);
    const probeLine = probes.length ? `<div class="why">Tripwire: ${probes.length} probe${probes.length > 1 ? "s" : ""}, last <b>${esc(probes[0].outcome)}</b> against #${probes[0].attestation_id} (${fmtTime(probes[0].probed_at)})${c.revoked ? " · <b>approval revoked</b>" : ""}.</div>` : "";
    const gate = vendor
      ? `<div class="gatebox">Onboarded supplier · paid <b>${Number(vendor.paid).toLocaleString()}</b>. The gate pays only while approved: <b>${gstat === "APPROVED" ? "would pay now" : "would refuse now (" + esc(gstat) + ")"}</b>.</div>`
      : `<div class="gatebox">Not an onboarded supplier. Onboarding ${status === "APPROVED" ? "would be allowed" : "would be refused (" + esc(status) + ")"}.</div>`;
    return `<article class="card">
      <div class="row"><div><div class="name">${esc(f ? f.company_name || label : label)}</div><div class="num">${esc(c.company_number)} · ${c.attestation_count} attestation${c.attestation_count === 1 ? "" : "s"}</div></div>
      <span class="pill ${pillClass(status)}">${esc(status.replaceAll("_", " "))}</span></div>
      <p class="why">${esc(reasonText(status))}</p>${bar}${barlab}${facts}${chain}${probeLine}${gate}</article>`;
  }

  const companies = D.companies.slice().sort((a, b) => {
    const rank = (c) => ({ APPROVED: 0, EXPIRED: 1, STALE: 1, REVOKED: 2 }[liveStatus(c)] ?? 3);
    return rank(a) - rank(b) || a.company_number.localeCompare(b.company_number);
  });
  const approved = D.companies.filter((c) => liveStatus(c) === "APPROVED").length;
  const refused = D.txs.filter((t) => t.step === "gate" && t.result === "FINISHED_WITH_ERROR");

  app.innerHTML = `
    <div class="top">
      <div><h1>KYB Desk</h1><p class="sub">Supplier approvals for UK companies that expire, react to the public register, and gate payments. Built on EntityStanding.</p></div>
      <div class="meta">${esc(D.chain)}<br>KYBDesk ${addr(D.desk.address)} · OnboardingGate ${addr(D.gate.address)}<br>
        Snapshot of the live contracts, taken <span id="snapage"></span></div>
    </div>
    <div class="stats">
      <div class="stat"><b>${approved}</b><span>approved right now</span></div>
      <div class="stat"><b>${D.companies.length - approved}</b><span>not approved</span></div>
      <div class="stat"><b>${D.desk.state.attestation_count}</b><span>attestations on-chain</span></div>
      <div class="stat"><b>${D.desk.state.probe_count}</b><span>tripwire probes</span></div>
      <div class="stat"><b>${D.gate.config.payment_count}</b><span>payments the gate allowed</span></div>
      <div class="stat"><b>${refused.length}</b><span>calls the gate refused</span></div>
    </div>

    <h2>How an approval works</h2>
    <div class="rules">
      <div><b>1 · Attest</b><span>Validators read Companies House and agree. Only GOOD_STANDING is an approval, valid for ${D.desk.rules.approval_days} days or until the day a filing deadline falls, whichever is first. One to ${D.desk.rules.max_batch} companies per transaction.</span></div>
      <div><b>2 · Probe</b><span>One page, no LLM. If the status, a deadline or an overdue flag no longer matches the attestation, the approval is revoked at once.</span></div>
      <div><b>3 · Expire</b><span>At valid_until the approval lapses, whatever the register says. Re-attesting is the only way back.</span></div>
      <div><b>4 · Gate</b><span>A supplier is paid only if approved at the moment of payment. Onboarding is a record, never a standing permission.</span></div>
    </div>

    <h2>Counterparties</h2>
    ${companies.map(card).join("")}

    <h2>OnboardingGate ledger</h2>
    <div class="tablewrap"><table>
      <tr><th>Call</th><th>Result</th><th>Tx</th></tr>
      ${D.txs.filter((t) => t.step === "gate").map((t) => `<tr><td class="mono">${esc(t.call)}(${esc((t.args || []).join(", "))})</td>
        <td>${t.result === "FINISHED_WITH_RETURN" ? '<span class="pill ok">recorded</span>' : '<span class="pill bad">refused</span> ' + esc(t.revert)}</td><td>${txl(t.tx)}</td></tr>`).join("")}
    </table></div>

    <footer>
      <p>An approval says what the public register said when it was read, and that a committee of validators agreed. It is not legal, credit or investment advice. Revocation and expiry are exercised on real captured pages in the test suite; in the live record the probe found no change and no approval was within 30 days of a deadline. See <a href="../CONTRACT.md">CONTRACT.md</a> for every transaction and what the live run does and does not show.</p>
    </footer>`;

  const age = document.getElementById("snapage");
  const tick = () => { age.textContent = `${fmtTime(D.snapshot_at)} (${dur(Date.now() - snapshotAt.getTime())} ago)`; };
  tick(); setInterval(tick, 30000);
})();
</script>
</body>
</html>
